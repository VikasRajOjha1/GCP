name: Terraform - Google Cloud VM

on:
  pull_request:
    paths:
      - "gke/VM_NEW/**"
      - ".github/workflows/gke-vm-terraform.yml"
  push:
    branches:
      - main
    paths:
      - "gke/VM_NEW/**"
      - ".github/workflows/gke-vm-terraform.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-gke-vm
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_WORKING_DIR: gke/VM_NEW
  TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}

jobs:
  terraform:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    name: Terraform ${{ github.event_name == 'pull_request' && 'plan' || 'apply' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        if: github.event_name != 'pull_request'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.7
          terraform_wrapper: false

      - name: Terraform format check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform initialize
        if: github.event_name != 'pull_request'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: >-
          terraform init -input=false
          -backend-config="bucket=${TF_BACKEND_BUCKET}"
          -backend-config="prefix=gke-vm/terraform/state"

      - name: Terraform initialize (pull request, local backend)
        if: github.event_name == 'pull_request'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform plan (main branch or manual run)
        if: github.event_name != 'pull_request'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Terraform apply (main branch or manual run)
        if: github.event_name != 'pull_request'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false -auto-approve tfplan